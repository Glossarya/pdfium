# Keeps pdfium/main equal to upstream PDFium's main, and reports what the fork
# hasn't merged yet (docs/embedpdf/upstream-sync.md). It never merges anything.
# Upstream commits that look like security fixes become warnings on the run:
# each one is a reason to start a release, whose first step is a sync.

name: Mirror upstream PDFium

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: embedpdf/main
          fetch-depth: 0

      - name: Fetch upstream main
        shell: bash
        run: git fetch --no-tags https://pdfium.googlesource.com/pdfium main:refs/remotes/upstream/main

      - name: Update pdfium/main
        shell: bash
        run: git push origin refs/remotes/upstream/main:refs/heads/pdfium/main

      - name: Report what embedpdf/main hasn't merged
        shell: bash
        run: |
          set -euo pipefail
          base=$(git merge-base HEAD upstream/main)
          count=$(git rev-list --count "$base..upstream/main")
          oldest=$(git log --reverse --format=%ci "$base..upstream/main" | head -1)
          {
            echo "## Upstream PDFium not in embedpdf/main"
            echo
            echo "- Base: \`$(git log -1 --format='%h %ad %s' --date=short "$base")\`"
            echo "- Unmerged upstream commits: **$count**${oldest:+, the oldest from $oldest}"
            echo
            echo "### Likely security fixes"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          git log --format='%h%x09%ad%x09%s' --date=short "$base..upstream/main" |
            grep -iE 'overflow|crash|out[- ]of[- ]bounds|use[- ]after[- ]free|heap|stack[- ]buffer|null deref|fuzz|security|sanitiz' |
            while IFS=$'\t' read -r hash date subject; do
              echo "- \`$hash\` $date $subject" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=Likely upstream security fix::$hash $subject"
            done || true
